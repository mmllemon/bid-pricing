<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工作台</title>
<style>
  html, body { margin:0; height:100%; background:#f4f3f0; color:#888;
    font-family:system-ui,"Microsoft YaHei",sans-serif; display:flex;
    align-items:center; justify-content:center; }
  .card { font-size:14px; }
</style>
</head>
<body>
<div class="card">正在打开工作台…</div>
<script>
/* 本页已并入 index.html 的「工作台」视图（该视图现为 React 版工作台的 iframe 宿主），不再是独立引擎。
 * 历史数据迁移：旧独立页用 gc-workbench-v1，正式入口用 gc-workbench-v2。
 * v2 不存在而 v1 存在时一次性迁移，避免旧数据「消失」。随后跳到正式入口。 */
(function () {
  try {
    var K2 = 'gc-workbench-v2', K1 = 'gc-workbench-v1';
    if (!localStorage.getItem(K2) && localStorage.getItem(K1)) {
      localStorage.setItem(K2, localStorage.getItem(K1));
    }
  } catch (e) {}
  location.replace('index.html#workbench');
})();
</script>
</body>
</html>
